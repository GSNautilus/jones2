# A free Supabase project with no activity for a week is paused. Touch the
# database every three days so a quiet spell between games does not stop it.
# Note: GitHub turns scheduled workflows off in a repository with no commits
# for 60 days (it emails first); re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        env:
          # Public by design: the same values ship in the site.
          SUPABASE_URL: https://adqanptxzjlxoiwhvvvk.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_18EYuISjhr_S2X06LDyRiA_0JIpi13q
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
