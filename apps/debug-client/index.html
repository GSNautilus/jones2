<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jones 2 — debug client</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f0; color: #222; }
      .wrap { display: grid; grid-template-columns: 280px 1fr 320px; gap: 12px; padding: 12px; min-height: 100vh; box-sizing: border-box; }
      .col { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; overflow: auto; max-height: calc(100vh - 24px); }
      h1, h2, h3 { margin: 0 0 8px; }
      h3 { margin-top: 14px; font-size: 13px; text-transform: uppercase; color: #666; letter-spacing: .05em; }
      button { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 6px 8px; border: 1px solid #bbb; background: #fafafa; border-radius: 4px; cursor: pointer; font: inherit; }
      button:hover:not(:disabled) { background: #e8f0ff; }
      button:disabled { color: #999; cursor: default; }
      button small { color: #888; float: right; }
      .stat { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dotted #eee; }
      .log li { margin: 2px 0; font-size: 13px; }
      .log .d { color: #777; }
      .tag { display: inline-block; font-size: 11px; padding: 1px 5px; border-radius: 3px; background: #eee; margin-left: 4px; }
      .bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
      .bar > div { height: 100%; background: #4a8; }
      .setup { max-width: 480px; margin: 40px auto; }
      .setup input { width: 100%; padding: 6px; margin: 4px 0 10px; font: inherit; box-sizing: border-box; }
      .report { background: #fffbe6; border: 1px solid #e6d98a; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
      .report li { font-size: 13px; }
      .report .d { color: #777; }
      .warn { color: #b00; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
